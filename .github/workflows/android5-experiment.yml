name: Android 5 compatibility experiment

# Intentionally separate from the upstream Android build and release workflows.
# This workflow is a diagnostic port attempt, NOT a release or a working APK guarantee.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android5-probe:
    name: API 21 compatibility probe
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out fork including submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Static Android 5 compatibility preflight
        run: python3 scripts/android5_preflight.py | tee android5-preflight.txt

      - name: Build experimental Android 5 debug APK
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleDebug \
            -Pandroid5Experiment=true \
            --no-daemon --stacktrace --warning-mode=all \
            2>&1 | tee android5-build.log

      - name: Upload compatibility diagnostics (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metro-android5-diagnostics
          path: |
            android5-preflight.txt
            android5-build.log
          if-no-files-found: warn

      - name: Upload debug APK only if compilation succeeds
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: metro-android5-debug-UNVERIFIED
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
